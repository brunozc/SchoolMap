name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements_dev.txt
      - name: Formatting (yapf)
        run: yapf --diff --recursive school_register tests
      - name: Lint (flake8)
        run: flake8 school_register tests
      - name: Types (mypy)
        run: mypy school_register tests

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the versions the README allows
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements_dev.txt
      - name: Tests (pytest)
        run: pytest
